services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediclaim-backend-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings
      - DEBUG=False
    env_file:
      - ./backend/backend/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mediclaim-network
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediclaim-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - ./frontend/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - backend
    networks:
      - mediclaim-network

networks:
  mediclaim-network:
    driver: bridge

volumes:
  backend_static:
  backend_media: